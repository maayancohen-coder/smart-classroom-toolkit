{% extends "base.html" %}
{% block title %}הקורסים שלי{% endblock %}
{% block head %}<style>.row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
 .live { background: var(--ok-bg); color: var(--ok); padding: 2px 10px; border-radius: 999px; font-size: .85rem; }</style>{% endblock %}
{% block body %}
<div class="wrap"><div class="card">
  <h1>הקורסים שלי</h1>
  <p class="muted">{{ student.name }} · <a href="/logout">יציאה</a></p>
  {% for c in courses %}
  <div class="row"><a href="/course/{{ c.id }}"><b>{{ c.name }}</b></a>
    {% if c.live %}<span class="live">שיעור פעיל</span>{% endif %}</div>
  {% else %}<p>אין לך קורסים רשומים.</p>{% endfor %}
</div></div>
{% endblock %}
