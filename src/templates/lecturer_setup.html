{% extends "base.html" %}
{% block title %}פתיחת שיעור{% endblock %}
{% block body %}
<div class="wrap"><div class="card">
  <h1>פתיחת שיעור</h1>
  <p class="muted">לחיצה אחת, והמערכת עושה את השאר.</p>

  <label for="course">שם הקורס</label>
  <select id="course"></select>
  <input id="courseNew" placeholder="שם הקורס החדש" style="display:none">

  <label>מיקום הכיתה</label>
  <button class="secondary" id="loc" type="button">📍 השתמש במיקום שלי</button>
  <p class="muted" id="locInfo" style="font-size:.9rem">לא הוגדר – בדיקת המיקום תיכבה.</p>

  <label for="radius">רדיוס (מטרים)</label>
  <input id="radius" type="number" min="20" value="{{ default_radius }}">

  <button class="full" id="open">פתח שיעור</button>
  <p id="msg"></p>
</div></div>
<script>
let pos = null;
const $ = id => document.getElementById(id);
const DEFAULT_COURSES = ["Intro to Software Engineering", "Algorithms 1", "Computer Networks",
                         "Probability", "System Programming 1"];
const NEW = "__new__";
function loadCourses() {
  let extra = [];
  try { extra = JSON.parse(localStorage.getItem("courses") || "[]"); } catch (e) {}
  return [...DEFAULT_COURSES, ...extra.filter(c => !DEFAULT_COURSES.includes(c))];
}
function renderCourses(selected) {
  const sel = $("course");
  sel.innerHTML = "";
  for (const c of loadCourses()) sel.add(new Option(c, c));
  sel.add(new Option("➕ קורס אחר…", NEW));
  let last = "";
  try { last = localStorage.getItem("lastCourse") || ""; } catch (e) {}
  sel.value = selected || last;
  if (!sel.value) sel.selectedIndex = 0;
  $("courseNew").style.display = sel.value === NEW ? "" : "none";
}
$("course").onchange = () => {
  $("courseNew").style.display = $("course").value === NEW ? "" : "none";
};
function chosenCourse() {
  const name = $("course").value === NEW ? $("courseNew").value.trim() : $("course").value;
  if (name) {
    try {
      localStorage.setItem("lastCourse", name);
      const extra = JSON.parse(localStorage.getItem("courses") || "[]");
      if (!DEFAULT_COURSES.includes(name) && !extra.includes(name))
        localStorage.setItem("courses", JSON.stringify([...extra, name]));
    } catch (e) {}
  }
  return name;
}
renderCourses();
$("loc").onclick = () => {
  $("locInfo").textContent = "מאתר…";
  navigator.geolocation.getCurrentPosition(
    p => { pos = p.coords; $("locInfo").textContent =
      `נקלט (דיוק ±${Math.round(p.coords.accuracy)} מ׳)`; },
    () => { $("locInfo").textContent = "לא התקבל אישור מיקום – בדיקת המיקום תיכבה."; },
    { enableHighAccuracy: true, timeout: 10000 });
};
$("open").onclick = async () => {
  const course = chosenCourse();
  if (!course) { $("msg").textContent = "יש לבחור או להקליד שם קורס"; return; }
  $("open").disabled = true;
  const res = await fetch("/api/session", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ course: course, radius: $("radius").value,
                           lat: pos && pos.latitude, lng: pos && pos.longitude }) });
  if (!res.ok) { $("msg").textContent = "שגיאה"; $("open").disabled = false; return; }
  location.href = (await res.json()).url;
};
</script>
{% endblock %}
